<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e1630">
  <title>VoiceCampus | Feedback inbox</title>
  <script>try{var t=localStorage.getItem("voicecampus_theme");if(t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark"}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="feedback">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar" id="topbar" data-title="Feedback inbox"></header>
    <main class="page">
      <div class="page-head">
        <div>
          <div class="eyebrow">Community voice</div>
          <h1>Feedback inbox</h1>
          <p class="lead">Explore submissions and follow their progress.</p>
        </div>
        <a class="btn btn-primary" href="submit.html"><span data-icon="plus"></span> New submission</a>
      </div>

      <div class="card toolbar" role="search">
        <div class="search">
          <span data-icon="search" data-size="18"></span>
          <input class="control" id="searchInput" type="search" placeholder="Search by title, message or location" aria-label="Search feedback" autocomplete="off">
        </div>
        <select class="control" id="categoryFilter" aria-label="Filter by category">
          <option value="all">All categories</option>
          <option>Academics</option><option>Administration</option><option>Infrastructure</option><option>Student Welfare</option><option>Technology</option><option>Other</option>
        </select>
        <select class="control" id="statusFilter" aria-label="Filter by status">
          <option value="all">All statuses</option>
          <option>Submitted</option><option>Under Review</option><option>In Progress</option><option>Resolved</option>
        </select>
      </div>

      <div class="list-meta"><span id="resultCount" aria-live="polite">0 submissions</span><span>Newest first</span></div>
      <div class="post-list" id="feedbackList"></div>
    </main>
    <footer class="app-footer"><strong>VoiceCampus</strong><span>Student voice · Institutional progress</span><span>Frontend prototype</span></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-icon" id="toastIcon"></span><p id="toastMessage"></p></div>
  <script src="js/script.js"></script>
</body>
</html>
